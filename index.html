}
function onPerfilChipChange(chk){
  var wrap = chk.closest('.perfil-chip');
  wrap.classList.toggle('on', chk.checked);
  if(chk.value==='admin' && chk.checked){
    document.querySelectorAll('#mu-perfil-chips input[type=checkbox]').forEach(function(c){
      if(c.value!=='admin'){ c.checked=false; c.closest('.perfil-chip').classList.remove('on'); c.disabled=true; }
    });
  } else if(chk.value==='admin' && !chk.checked){
    document.querySelectorAll('#mu-perfil-chips input[type=checkbox]').forEach(function(c){ c.disabled=false; });
  }
}
function abrirModalUsuario(id){
  document.getElementById('mu-id').value = id||'';
  document.querySelectorAll('#mu-perfil-chips input[type=checkbox]').forEach(function(c){ c.checked=false; c.disabled=false; c.closest('.perfil-chip').classList.remove('on'); });
  if(id){
    var u = state.usuarios.find(function(x){ return x.id===id; });
    document.getElementById('modal-usuario-titulo').textContent = '✏️ Editar usuário';
    document.getElementById('mu-nome').value = u.nome||'';
    document.getElementById('mu-usuario').value = u.usuario||'';
    document.getElementById('mu-senha').value = '';
    document.getElementById('mu-senha-lbl').textContent = 'Nova senha (deixe em branco para manter)';
    document.getElementById('mu-ativo').checked = !!u.ativo;
    (u.perfil||[]).forEach(function(p){
      var c = document.querySelector('#mu-perfil-chips input[value="'+p+'"]');
      if(c){ c.checked = true; c.closest('.perfil-chip').classList.add('on'); }
    });
    if(u.perfil && u.perfil.indexOf('admin')>-1) onPerfilChipChange(document.querySelector('#mu-perfil-chips input[value="admin"]'));
  } else {
    document.getElementById('modal-usuario-titulo').textContent = '👤 Novo usuário';
    document.getElementById('mu-nome').value = '';
    document.getElementById('mu-usuario').value = '';
    document.getElementById('mu-senha').value = '';
    document.getElementById('mu-senha-lbl').textContent = 'Senha *';
    document.getElementById('mu-ativo').checked = true;
  }
  document.getElementById('modal-usuario').style.display = 'flex';
}
function fecharModalUsuario(){ document.getElementById('modal-usuario').style.display = 'none'; }
async function salvarUsuario(){
  var id = document.getElementById('mu-id').value;
  var nome = document.getElementById('mu-nome').value.trim();
  var usuario = document.getElementById('mu-usuario').value.trim();
  var senha = document.getElementById('mu-senha').value;
  var ativo = document.getElementById('mu-ativo').checked;
  var perfil = Array.prototype.slice.call(document.querySelectorAll('#mu-perfil-chips input[type=checkbox]:checked')).map(function(c){ return c.value; });
  if(!nome || !usuario){ mostrarNotify('err','Preencha nome e usuário.'); return; }
  if(!perfil.length){ mostrarNotify('err','Selecione ao menos um perfil de acesso.'); return; }
  var existente = state.usuarios.find(function(u){ return normalizeStr(u.usuario)===normalizeStr(usuario) && u.id!==id; });
  if(existente){ mostrarNotify('err','Já existe um usuário com esse login.'); return; }
  if(!id && !senha){ mostrarNotify('err','Informe uma senha para o novo usuário.'); return; }
  if(senha && senha.length < 4){ mostrarNotify('err','A senha deve ter ao menos 4 caracteres.'); return; }
  if(id){
    var u = state.usuarios.find(function(x){ return x.id===id; });
    u.nome = nome; u.usuario = usuario; u.perfil = perfil; u.ativo = ativo;
    if(senha) u.senhaHash = await sha256Hex(senha);
    delete u._bootstrap;
  } else {
    state.usuarios.push({ id: uid(), nome:nome, usuario:usuario, senhaHash: await sha256Hex(senha), perfil:perfil, ativo:ativo });
  }
  saveState();
  fecharModalUsuario();
  renderUsuarios();
  mostrarNotify('ok','Usuário salvo.');
}
function excluirUsuario(id){
  if(id===state.currentUser.id){ mostrarNotify('err','Você não pode excluir o próprio usuário logado.'); return; }
  if(!confirm('Excluir este usuário? Ele perderá o acesso ao sistema imediatamente.')) return;
  state.usuarios = state.usuarios.filter(function(u){ return u.id!==id; });
  excluirNaPlanilha('usuarios', id);
  saveState();
  renderUsuarios();
  mostrarNotify('ok','Usuário excluído.');
}

  {chave:'ativo', label:'Ativo / Identificação', obrig:true},

function onImportFileSelected(input){
  var file = input.files[0];
  if(!file) return;
  var statusEl = document.getElementById('imp-status');
  statusEl.textContent = 'Lendo arquivo...';
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var wb = XLSX.read(e.target.result, {type:'array'});
      var primeiraAba = wb.SheetNames[0];
      var linhas = XLSX.utils.sheet_to_json(wb.Sheets[primeiraAba], {defval:''});
      if(!linhas.length){ statusEl.textContent = 'A planilha está vazia ou não foi possível ler as linhas.'; statusEl.style.color='var(--err)'; return; }
      _imp.linhas = linhas;
      _imp.colunas = Object.keys(linhas[0]);
      statusEl.style.color = 'var(--ok)';
      statusEl.textContent = '✅ '+linhas.length+' linha(s) encontrada(s), '+_imp.colunas.length+' coluna(s) detectada(s).';
      renderMapeamentoImportacao();
    }catch(err){
      statusEl.style.color = 'var(--err)';
      statusEl.textContent = '❌ Não foi possível ler o arquivo: '+err.message;
    }
  };
  reader.readAsArrayBuffer(file);
}
function melhorPalpite(colunas, alvos){
  for(var i=0;i<colunas.length;i++){
    var norm = normalizeStr(colunas[i]);
    for(var j=0;j<alvos.length;j++){ if(norm.indexOf(alvos[j])>-1) return colunas[i]; }
  }
  return '';
}
var PALPITES = {
  ativo:['ativo','patrimonio','descricao','item','nome','equipamento'],
  categoria:['categoria','tipo item','classe'],
  local:['local','setor','placa','localizacao'],
  periodicidade:['periodicidade','frequencia'],
  ultimaExecucao:['ultima','execucao anterior'],
  proximaData:['proxima','vencimento','validade'],
  responsavel:['responsavel','prestador','fornecedor'],
  valor:['valor','custo','preco'],
  obs:['obs','observ'],
  placa:['placa'],
  modelo:['modelo','descricao','veiculo'],
  kmAtual:['km','odometro','quilometragem']
};
function renderMapeamentoImportacao(){
  var campos = _imp.destino==='itens' ? CAMPOS_ITEM : CAMPOS_VEICULO;
  var opcoes = '<option value="">— não importar —</option>' + _imp.colunas.map(function(c){ return '<option value="'+esc(c)+'">'+esc(c)+'</option>'; }).join('');
  var html = '<div class="panel-card"><div class="panel-title">Mapeamento de colunas</div>';
  campos.forEach(function(c){

    html += '<div class="imp-map-row"><label>'+esc(c.label)+(c.obrig?' *':'')+'</label>'
      + '<select id="imp-map-'+c.chave+'">'+opcoes.replace('value="'+esc(palpite)+'"','value="'+esc(palpite)+'" selected')+'</select></div>';
  });
  html += '<div class="panel-hint">Campos não mapeados ficam em branco (ou usam um valor padrão, quando aplicável — ex: periodicidade "Anual" se não informada).</div>';
  html += '<div class="imp-preview-wrap"><table class="imp-table"><thead><tr>'+_imp.colunas.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr></thead><tbody>'
    + _imp.linhas.slice(0,5).map(function(l){ return '<tr>'+_imp.colunas.map(function(c){ return '<td>'+esc(l[c])+'</td>'; }).join('')+'</tr>'; }).join('')
    + '</tbody></table></div>';
  html += '<div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn-g" onclick="confirmarImportacao()">✅ Importar '+_imp.linhas.length+' registro(s)</button></div>';
  html += '</div>';
  document.getElementById('imp-mapeamento').innerHTML = html;
}
function confirmarImportacao(){
  var destino = document.getElementById('imp-destino').value;
  var unidade = document.getElementById('imp-unidade').value;
  var campos = destino==='itens' ? CAMPOS_ITEM : CAMPOS_VEICULO;
  var mapa = {};
  campos.forEach(function(c){ mapa[c.chave] = document.getElementById('imp-map-'+c.chave).value; });
  var obrigFaltando = campos.filter(function(c){ return c.obrig && !mapa[c.chave]; });
  if(obrigFaltando.length){ mostrarNotify('err','Mapeie ao menos o campo obrigatório: '+obrigFaltando.map(function(c){return c.label;}).join(', ')); return; }

  var hoje = new Date().toISOString().slice(0,10);
  var importados = 0, ignorados = 0;

  if(destino==='itens'){
    var tipoItem = document.getElementById('imp-tipoitem').value;
    _imp.linhas.forEach(function(l){
      var ativo = String(l[mapa.ativo]||'').trim();
      if(!ativo){ ignorados++; return; }
      var periodicidade = String(l[mapa.periodicidade]||'').trim() || 'Anual';
      if(!PERIODO_MESES[periodicidade] && !PERIODO_DIAS[periodicidade]) periodicidade = 'Anual';
      var ultima = parseDataPlanilha(l[mapa.ultimaExecucao]);
      var proxima = parseDataPlanilha(l[mapa.proximaData]) || calcProxima(ultima || hoje, periodicidade);
      state.itens[unidade].push({
        id: uid(), tipo: tipoItem,
        categoria: String(l[mapa.categoria]||'').trim() || 'Outros',
        ativo: ativo,
        local: String(l[mapa.local]||'').trim(),
        periodicidade: periodicidade,
        ultimaExecucao: ultima || '',
        proximaData: proxima || hoje,
        responsavel: String(l[mapa.responsavel]||'').trim(),
        valor: parseFloat(l[mapa.valor]) || 0,
        obs: String(l[mapa.obs]||'').trim()
      });
      importados++;
    });
  } else {
    _imp.linhas.forEach(function(l){
      var placa = String(l[mapa.placa]||'').trim();
      if(!placa){ ignorados++; return; }
      state.veiculos[unidade].push({
        id: uid(), placa: placa,
        modelo: String(l[mapa.modelo]||'').trim(),
        kmAtual: parseFloat(l[mapa.kmAtual]) || 0,
        atualizadoEm: hoje
      });
      importados++;
    });
  }

  saveState();
  document.getElementById('imp-file').value = '';
  document.getElementById('imp-mapeamento').innerHTML = '';
  document.getElementById('imp-status').textContent = '';
  mostrarNotify('ok', importados+' registro(s) importado(s) para '+unidade+(ignorados?' ('+ignorados+' ignorado(s) sem o campo obrigatório).':'.'));
}
function parseDataPlanilha(v){
  if(!v && v!==0) return '';
  if(v instanceof Date) return v.toISOString().slice(0,10);
  var s = String(v).trim();
  if(!s) return '';
  var m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m) return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if(/^\d+(\.\d+)?$/.test(s)){
    var serial = parseFloat(s);
    var dt = new Date(Math.round((serial-25569)*86400*1000));
    if(!isNaN(dt.getTime())) return dt.toISOString().slice(0,10);
  }
  return '';
}

function csvEscape(v){
  v = String(v==null?'':v);
  if(/[",;\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function baixarArquivo(nome, conteudo, mime){
  var blob = new Blob([conteudo], {type:mime});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = nome;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportarCSV(qual){
  var linhas = [];
  if(qual==='itens'){
    linhas.push(['Unidade','Tipo','Ativo','Categoria','Local','Periodicidade','UltimaExecucao','ProximaData','Responsavel','Custo','Observacoes','VeiculoPlaca','KmUltima','KmIntervalo','KmProxima'].join(';'));
    todosItensUnidade().forEach(function(i){
      var veic = i.veiculoId ? encontrarVeiculo(i.veiculoId) : null;
      var kmProx = (i.kmUltima!=null && i.kmIntervalo) ? (parseFloat(i.kmUltima)+parseFloat(i.kmIntervalo)) : '';
      linhas.push([state.unit,i.tipo,i.ativo,i.categoria,i.local,i.periodicidade,i.ultimaExecucao,i.proximaData,i.responsavel,i.valor,i.obs,veic?veic.placa:'',i.kmUltima||'',i.kmIntervalo||'',kmProx].map(csvEscape).join(';'));
    });
    baixarArquivo('manutencoes_'+state.unit.replace(/\s+/g,'_')+'.csv', '\uFEFF'+linhas.join('\n'), 'text/csv;charset=utf-8');
  } else {
    linhas.push(['Unidade','Placa','Modelo','KmAtual','AtualizadoEm'].join(';'));
    todosVeiculosUnidade().forEach(function(v){
      linhas.push([state.unit,v.placa,v.modelo,v.kmAtual,v.atualizadoEm].map(csvEscape).join(';'));
    });
    baixarArquivo('veiculos_'+state.unit.replace(/\s+/g,'_')+'.csv', '\uFEFF'+linhas.join('\n'), 'text/csv;charset=utf-8');
  }
  mostrarNotify('ok','Arquivo CSV gerado.');
}

function mostrarNotify(tipo, msg){
  var el = document.getElementById('notify');
  el.textContent = msg;
  el.className = 'notify '+tipo+' show';
  setTimeout(function(){ el.classList.remove('show'); }, 3500);
}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manutenção Preventiva & Documentação Legal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#00843D;--g2:#006B31;--gd:#004D23;
  --gl:#E8F5E9;--gb:#C8E6C9;
  --bg:#F0F2F5;--card:#fff;
  --border:#E2E6EA;--border2:#CDD3DA;
  --txt:#111827;--txt2:#4B5563;--txt3:#9CA3AF;
  --warn:#D97706;--warnl:#FEF3C7;
  --err:#DC2626;--errl:#FEE2E2;
  --info:#1D4ED8;
  --ok:#15803D;--okl:#DCFCE7;
  --r:12px;
  --sh:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
  --font:'DM Sans',system-ui,sans-serif;
  --mono:'DM Mono',monospace;
}
body{font-family:var(--font);background:var(--bg);color:var(--txt);font-size:14px;min-height:100vh}
button,select,input,textarea{font-family:inherit}
button{cursor:pointer}
button:disabled{opacity:0.6;cursor:not-allowed}

.app{display:flex;min-height:100vh}
.sb{width:230px;background:var(--gd);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;flex-shrink:0}
.main{margin-left:230px;flex:1;display:flex;flex-direction:column}

.sb-head{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-logo-img{background:#fff;border-radius:9px;padding:8px 10px;display:inline-block;margin-bottom:10px}
.sb-logo-img img{height:30px;width:auto;display:block}
.sb-brand{font-size:14px;font-weight:700;color:#fff;line-height:1.3}
.sb-sub{font-size:11px;color:rgba(255,255,255,.5);margin-top:2px}

.nav-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.35);padding:18px 20px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:13px;font-weight:500;color:rgba(255,255,255,.65);border:none;background:none;width:100%;text-align:left;cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav-item.on{color:#fff;background:rgba(255,255,255,.1);border-left-color:var(--gb)}
.nav-item .ni{font-size:16px;width:20px;text-align:center;opacity:.7}
.nav-item.on .ni{opacity:1}

.unit-item{display:flex;align-items:center;gap:10px;padding:8px 20px 8px 24px;font-size:12px;font-weight:400;color:rgba(255,255,255,.55);border:none;background:none;width:100%;text-align:left;cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.unit-item:hover{color:rgba(255,255,255,.9);background:rgba(255,255,255,.05)}
.unit-item.on{color:#fff;font-weight:600;border-left-color:var(--gb);background:rgba(255,255,255,.08)}
.unit-dot{width:7px;height:7px;border-radius:50%;background:var(--gb);opacity:.5;flex-shrink:0}
.unit-item.on .unit-dot{opacity:1;background:#fff}

.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:60}
.tb-title{font-size:18px;font-weight:700;color:var(--txt)}
.tb-sub{font-size:12px;color:var(--txt3);margin-top:2px}
.content{padding:24px 28px 60px;flex:1}

.btn-g{background:var(--g);color:#fff;border:none;border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;transition:background .15s}
.btn-g:hover:not(:disabled){background:var(--g2)}
.btn-s{background:var(--card);color:var(--txt2);border:1px solid var(--border2);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600}
.btn-s:hover:not(:disabled){border-color:var(--g);color:var(--g)}
.btn-danger{background:none;color:var(--err);border:1px solid var(--errl);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:600}
.btn-danger:hover{background:var(--errl)}
.btn-mini{background:var(--bg);color:var(--txt2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:600}
.btn-mini:hover{border-color:var(--g);color:var(--g)}
.btn-mini-g{background:var(--gl);color:var(--gd);border:1px solid var(--gb);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:600}
.btn-mini-g:hover{background:var(--gb)}

.custo-total-card{background:linear-gradient(135deg,var(--gd),var(--g));border-radius:var(--r);padding:20px 24px;color:#fff;margin-bottom:16px;box-shadow:0 4px 20px rgba(0,77,35,.2)}
.ct-label{font-size:12px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.ct-val{font-size:32px;font-weight:700;line-height:1}
.ct-grid{display:flex;gap:28px;margin-top:14px;flex-wrap:wrap}
.ct-item-lbl{font-size:11px;color:rgba(255,255,255,.6)}
.ct-item-val{font-size:16px;font-weight:700;margin-top:2px}

.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}

.segmented{display:inline-flex;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.seg-btn{border:none;background:none;padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--txt2);border-radius:7px;cursor:pointer;transition:all .15s;white-space:nowrap}
.seg-btn:hover{color:var(--txt)}
.seg-btn.on{background:var(--g);color:#fff}

.alert-bar{background:var(--errl);color:var(--err);border-radius:10px;padding:12px 16px;font-size:13px;margin-bottom:16px;border:1px solid #f5b5b5}
.alert-bar.st-warn{background:var(--warnl);color:#92400E;border-color:#fcd9a0}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;transition:box-shadow .15s,transform .1s;cursor:pointer}
.kpi-card:hover{box-shadow:0 4px 18px rgba(0,132,61,.13);transform:translateY(-2px)}
.kpi-active{border:2px solid var(--g)!important;background:var(--gl)!important;transform:translateY(-2px)}
.kpi-icon{font-size:20px;margin-bottom:8px}
.kpi-val{font-size:26px;font-weight:700;color:var(--txt)}
.kpi-lbl{font-size:12px;color:var(--txt2);font-weight:600;margin-top:2px}
.kpi-sub{font-size:11px;color:var(--txt3);margin-top:6px}
.kpi-hint{font-size:10px;color:var(--g);font-weight:600;margin-top:6px;opacity:.7;text-transform:uppercase;letter-spacing:.05em}
.kpi-active .kpi-hint{opacity:1}

.dash-filtro-btn{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:5px 13px;font-size:11px;font-weight:600;color:var(--txt2);cursor:pointer;transition:all .15s;white-space:nowrap}
.dash-filtro-btn:hover{border-color:var(--g);color:var(--g)}
.dash-filtro-btn.on{background:var(--g);border-color:var(--g);color:#fff}

.mnt-search-wrap{position:relative;flex:1;min-width:220px;max-width:360px}
.mnt-search-box{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border2);border-radius:20px;padding:6px 13px;transition:border-color .15s,box-shadow .15s}
.mnt-search-box:focus-within{border-color:var(--g);box-shadow:0 0 0 3px rgba(0,132,61,.12)}
.mnt-search-icon{font-size:12px;color:var(--txt3);flex-shrink:0}
.mnt-search-input{border:none;outline:none;background:none;font-size:12px;font-weight:500;color:var(--txt);width:100%}
.mnt-search-input::placeholder{color:var(--txt3);font-weight:400}
.mnt-search-clear{border:none;background:none;color:var(--txt3);cursor:pointer;font-size:13px;line-height:1;padding:2px;flex-shrink:0;border-radius:50%}
.mnt-search-clear:hover{color:var(--err);background:rgba(220,38,38,.08)}
.mnt-search-drop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.12);z-index:50;max-height:300px;overflow-y:auto;padding:6px}
.mnt-search-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;color:var(--txt)}
.mnt-search-item:hover,.mnt-search-item.hl{background:var(--gl);color:var(--gd)}
.mnt-search-item .msi-status{margin-left:auto;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;flex-shrink:0}
.mnt-search-empty{padding:14px 10px;text-align:center;font-size:12px;color:var(--txt3)}
.mnt-search-count{padding:6px 10px 2px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--txt3)}
.mnt-active-chip{display:flex;align-items:center;gap:6px;background:var(--g);border:1px solid var(--g);color:#fff;border-radius:20px;padding:4px 6px 4px 12px;font-size:11px;font-weight:600;white-space:nowrap}
.mnt-active-chip button{border:none;background:rgba(255,255,255,.2);color:#fff;width:18px;height:18px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}
.mnt-active-chip button:hover{background:rgba(255,255,255,.35)}

.mnt-list{display:flex;flex-direction:column;gap:10px}
.mnt-card{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--border2);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .15s}
.mnt-card:hover{box-shadow:0 2px 14px rgba(0,0,0,.06)}
.mnt-card.st-ok{border-left-color:var(--ok)}
.mnt-card.st-warn{border-left-color:var(--warn)}
.mnt-card.st-late{border-left-color:var(--err)}
.mnt-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.mnt-titlewrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mnt-tipico{font-size:15px}
.mnt-nome{font-size:14px;font-weight:700;color:var(--txt)}
.mnt-cat{font-size:11px;color:var(--txt3);font-weight:500}
.badge{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;flex-shrink:0}
.badge-ok{background:var(--okl);color:var(--ok)}
.badge-warn{background:var(--warnl);color:var(--warn)}
.badge-late{background:var(--errl);color:var(--err)}
.mnt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mnt-field-lbl{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.mnt-field-val{font-size:13px;color:var(--txt);font-weight:600;margin-top:2px}
.mnt-field-val.late{color:var(--err)}
.mnt-field-val.warn{color:var(--warn)}
.mnt-obs{font-size:12px;color:var(--txt2);background:var(--bg);border-radius:8px;padding:8px 10px}
.mnt-actions{display:flex;gap:8px;justify-content:flex-end}

.empty-state{text-align:center;padding:60px 20px;color:var(--txt3)}
.empty-state .es-ic{font-size:36px;margin-bottom:10px}
.empty-state .es-txt{font-size:13px}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#fff;border-radius:16px;padding:28px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.15)}
.form-g{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:11px;font-weight:600;color:var(--txt2)}
.fld input,.fld select,.fld textarea{border:1px solid var(--border2);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--txt);outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(0,132,61,.1)}
.form-full{grid-column:1/-1}

.notify{position:fixed;bottom:24px;right:24px;background:var(--txt);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.2);z-index:500;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none}
.notify.show{opacity:1;transform:translateY(0)}
.notify.ok{background:var(--ok)}
.notify.err{background:var(--err)}

.mnt-km-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.km-chip{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:600;color:var(--txt2)}
.km-chip.late{background:var(--errl);color:var(--err);border-color:var(--errl)}
.km-chip.warn{background:var(--warnl);color:var(--warn);border-color:var(--warnl)}
.km-chip.ok{background:var(--okl);color:var(--ok);border-color:var(--okl)}
.frota-only{display:none}
.frota-only.show{display:flex}

.veic-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.veic-info{display:flex;flex-direction:column;gap:3px}
.veic-placa{font-size:14px;font-weight:700;color:var(--txt)}
.veic-modelo{font-size:12px;color:var(--txt3)}
.veic-km{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--g)}
.veic-km input{width:110px;border:1px solid var(--border2);border-radius:8px;padding:6px 9px;font-size:12px}

.chk-tpl-item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.chk-tpl-nome{flex:1;font-size:13px;font-weight:600;color:var(--txt)}
.chk-status-grp{display:flex;gap:5px}
.chk-status-btn{border:1px solid var(--border2);background:var(--card);border-radius:7px;padding:5px 10px;font-size:11px;font-weight:700;color:var(--txt3);cursor:pointer}
.chk-status-btn[data-v="ok"].on{background:var(--okl);color:var(--ok);border-color:var(--ok)}
.chk-status-btn[data-v="atencao"].on{background:var(--warnl);color:var(--warn);border-color:var(--warn)}
.chk-status-btn[data-v="naoOk"].on{background:var(--errl);color:var(--err);border-color:var(--err)}
.chk-status-btn[data-v="na"].on{background:var(--bg);color:var(--txt2);border-color:var(--border2)}
.chk-obs-input{width:200px;border:1px solid var(--border2);border-radius:7px;padding:5px 9px;font-size:11px}
.chk-hist-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chk-hist-meta{font-size:12px;color:var(--txt2)}
.chk-hist-meta b{color:var(--txt)}

.avaria-add-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.avaria-add-row .fld{flex:1;min-width:160px}
.avaria-list{display:flex;flex-direction:column;gap:8px}
.avaria-item{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:9px;padding:9px 12px}
.avaria-item .av-desc{flex:1;font-size:12px;font-weight:600;color:var(--txt)}
.avaria-item .av-local{font-size:11px;color:var(--txt3)}
.grav-badge{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;white-space:nowrap}
.grav-badge.leve{background:var(--okl);color:var(--ok)}
.grav-badge.media{background:var(--warnl);color:var(--warn)}
.grav-badge.grave{background:var(--errl);color:var(--err)}
.av-status-btn{border:1px solid var(--border2);background:var(--card);border-radius:20px;padding:4px 12px;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap}
.av-status-btn.aberta{background:var(--errl);color:var(--err);border-color:var(--errl)}
.av-status-btn.resolvida{background:var(--okl);color:var(--ok);border-color:var(--okl)}
.km-vistoria-chip{background:var(--gl);color:var(--gd);border:1px solid var(--gb);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700}
.av-foto-thumb{width:42px;height:42px;border-radius:8px;object-fit:cover;border:1px solid var(--border2);cursor:pointer;flex-shrink:0}
.av-foto-add{display:flex;align-items:center;gap:8px}
.av-foto-add label{background:var(--bg);border:1px dashed var(--border2);border-radius:8px;padding:8px 12px;font-size:11px;font-weight:600;color:var(--txt2);cursor:pointer;white-space:nowrap;height:38px;display:flex;align-items:center;gap:6px}
.av-foto-add label:hover{border-color:var(--g);color:var(--g)}
.av-foto-preview{width:38px;height:38px;border-radius:7px;object-fit:cover;border:1px solid var(--border2)}
.lightbox-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:900;align-items:center;justify-content:center;padding:24px}
.lightbox-bg img{max-width:92vw;max-height:92vh;border-radius:8px}

.panel-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.panel-title{font-size:14px;font-weight:700;color:var(--txt);margin-bottom:12px}
.panel-hint{font-size:11px;color:var(--txt3);margin-top:6px;line-height:1.5}
.tag-status{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700}
.tag-status.on{background:var(--okl);color:var(--ok)}
.tag-status.off{background:var(--errl);color:var(--err)}

#print-area{display:none}
body.printing > .app, body.printing .notify, body.printing .modal-bg{display:none!important}
body.printing #print-area{display:block!important}
.rp-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--g);padding-bottom:14px;margin-bottom:18px}
.rp-header-left{display:flex;align-items:center;gap:14px}
.rp-logo{height:46px;width:auto;flex-shrink:0}
.rp-title{font-size:20px;font-weight:700;color:var(--gd)}
.rp-sub{font-size:12px;color:var(--txt2);margin-top:3px}
.rp-meta{text-align:right;font-size:11px;color:var(--txt3)}
.rp-section-title{font-size:13px;font-weight:700;color:var(--gd);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.rp-kpis{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.rp-kpi{border:1px solid var(--border);border-radius:8px;padding:10px 14px;min-width:110px}
.rp-kpi b{display:block;font-size:18px;color:var(--txt)}
.rp-kpi span{font-size:10px;color:var(--txt3);text-transform:uppercase}
table.rp-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:14px}
table.rp-table th{background:var(--gl);color:var(--gd);text-align:left;padding:6px 8px;border:1px solid var(--gb);font-size:10px;text-transform:uppercase}
table.rp-table td{padding:6px 8px;border:1px solid var(--border);color:var(--txt)}
table.rp-table tr:nth-child(even) td{background:#FAFBFC}
.rp-footer{margin-top:24px;font-size:10px;color:var(--txt3);border-top:1px solid var(--border);padding-top:10px}
@media print{
  @page{margin:14mm}
  body{background:#fff}
  #print-area{padding:0}
}

@media(max-width:1000px){
  .dash-grid{grid-template-columns:repeat(2,1fr)}
  .mnt-grid{grid-template-columns:repeat(2,1fr)}
  .form-g{grid-template-columns:1fr}
  .dash-grid[style*="repeat(3"]{grid-template-columns:1fr !important}
}

/* ===== LOGIN ===== */
.login-screen{position:fixed;inset:0;background:linear-gradient(135deg,var(--gd),var(--g));display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.login-box{background:#fff;border-radius:16px;padding:36px 34px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.login-logo .li{width:42px;height:42px;background:var(--g);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.login-logo b{font-size:16px;color:var(--txt)}
.login-logo span{display:block;font-size:11px;color:var(--txt3)}
.login-title{font-size:13px;font-weight:700;color:var(--txt2);margin-bottom:16px}
.login-fld{margin-bottom:14px}
.login-fld label{display:block;font-size:11px;font-weight:600;color:var(--txt2);margin-bottom:5px}
.login-fld input{width:100%;border:1px solid var(--border2);border-radius:9px;padding:11px 13px;font-size:13px;outline:none}
.login-fld input:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(0,132,61,.12)}
.login-btn{width:100%;background:var(--g);color:#fff;border:none;border-radius:9px;padding:12px;font-size:13.5px;font-weight:700;margin-top:6px}
.login-btn:hover:not(:disabled){background:var(--g2)}
.login-err{background:var(--errl);color:var(--err);border-radius:8px;padding:9px 12px;font-size:12px;font-weight:600;margin-bottom:14px;display:none}
.login-hint{font-size:11px;color:var(--txt3);margin-top:16px;line-height:1.6;background:var(--bg);border-radius:8px;padding:10px 12px}

.user-box{display:flex;align-items:center;gap:10px}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.user-meta{text-align:right}
.user-nome{font-size:12.5px;font-weight:700;color:var(--txt)}
.user-perfil{font-size:10.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em}
.btn-logout{background:none;border:1px solid var(--border2);color:var(--txt3);border-radius:8px;padding:7px 10px;font-size:11px;font-weight:600}
.btn-logout:hover{border-color:var(--err);color:var(--err)}

.perfil-chips{display:flex;gap:8px;flex-wrap:wrap}
.perfil-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;font-size:12px;font-weight:600;color:var(--txt2);cursor:pointer;background:var(--card)}
.perfil-chip input{margin:0}
.perfil-chip.on{border-color:var(--g);background:var(--gl);color:var(--gd)}
.usr-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 18px;margin-bottom:10px}
.usr-nome{font-size:13px;font-weight:700;color:var(--txt)}
.usr-login{font-size:11.5px;color:var(--txt3);font-family:var(--mono)}
.usr-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.usr-badge{background:var(--gl);color:var(--gd);border-radius:20px;padding:2px 9px;font-size:9.5px;font-weight:700;text-transform:uppercase}
.usr-badge.inativo{background:var(--errl);color:var(--err)}
.imp-drop{border:2px dashed var(--border2);border-radius:12px;padding:30px;text-align:center;color:var(--txt2);font-size:13px}
.imp-drop input{margin-top:10px}
.imp-map-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.imp-map-row label{font-size:12px;font-weight:600;color:var(--txt2)}
.imp-map-row select{border:1px solid var(--border2);border-radius:8px;padding:7px 10px;font-size:12px}
.imp-preview-wrap{overflow-x:auto;margin-top:10px}
table.imp-table{width:100%;border-collapse:collapse;font-size:11px}
table.imp-table th{background:var(--gl);color:var(--gd);text-align:left;padding:6px 8px;border:1px solid var(--gb);white-space:nowrap}
table.imp-table td{padding:6px 8px;border:1px solid var(--border);white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
</style>
</head>

function esc(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, function(m) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[m];
  });
}

function uid(){ return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function normalizeStr(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function fmtData(iso){
  if(!iso) return '—';
  var p = iso.split('-');
  return p[2]+'/'+p[1]+'/'+p[0];
}
function fmtVal(v){
  v = parseFloat(v)||0;
  return 'R$ ' + v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}

var DB = {
  loading: false,
  load: async function() {
    this.loading = true;
    try {
      var res = await fetch(SCRIPT_URL);
      var data = await res.json();

      // Zera os arrays locais antes de repovoar — sem isso, chamar load() mais
      // de uma vez na mesma sessão (reconectar Sheets, "Sincronizar agora",
      // etc.) duplicaria cada registro já carregado anteriormente.
      ['itens', 'veiculos', 'checklists', 'documentos', 'indicadores'].forEach(function(tabela) {
        UNIDADES.forEach(function(u){ state[tabela][u] = []; });
      });

      ['itens', 'veiculos', 'checklists', 'documentos', 'indicadores'].forEach(function(tabela) {
        var nomeAba = tabela === 'itens' ? 'Manutencoes' : tabela.charAt(0).toUpperCase() + tabela.slice(1);
        if(data[nomeAba]) {
          data[nomeAba].forEach(function(row) {
            if(row.itens && typeof row.itens === 'string') row.itens = JSON.parse(row.itens);
            if(row.avarias && typeof row.avarias === 'string') row.avarias = JSON.parse(row.avarias);
            var uni = row._unidade || row.unidade;
            if(uni && state[tabela][uni]) state[tabela][uni].push(row);
          });
        }
      });
      if(data.Usuarios && data.Usuarios.length){
        state.usuarios = data.Usuarios.map(function(u){
          if(u.perfil && typeof u.perfil === 'string'){ try{ u.perfil = JSON.parse(u.perfil); }catch(e){ u.perfil = [u.perfil]; } }
          u.ativo = (u.ativo === true || u.ativo === 'true' || u.ativo === 1 || u.ativo === '1');
          return u;
        });
      }
      return true;
    } catch(e) {
      console.error("Erro ao carregar do Sheets:", e);
      return false;
    } finally {
      this.loading = false;
    }
  },
  save: async function() {
    if(SCRIPT_URL === 'SUA_URL_DO_APPS_SCRIPT_AQUI') return; // Bloqueia requisição nula
    var payload = { itens: [], veiculos: [], checklists: [], documentos: [], indicadores: [], usuarios: [] };
    
    UNIDADES.forEach(function(u){
      state.itens[u].forEach(function(i){ payload.itens.push(Object.assign({}, i, {_unidade: u})); });
      state.veiculos[u].forEach(function(v){ payload.veiculos.push(Object.assign({}, v, {_unidade: u})); });
      state.checklists[u].forEach(function(c){ payload.checklists.push(Object.assign({}, c, {_unidade: u})); });
      state.documentos[u].forEach(function(d){ payload.documentos.push(Object.assign({}, d, {_unidade: u})); });
      state.indicadores[u].forEach(function(ind){ payload.indicadores.push(Object.assign({}, ind, {_unidade: u})); });
    });
    state.usuarios.forEach(function(u){ payload.usuarios.push(Object.assign({}, u, {perfil: JSON.stringify(u.perfil||[])})); });

    try {
      mostrarNotify('ok', 'Sincronizando com o Sheets...');
      await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      mostrarNotify('ok', 'Dados salvos no Sheets!');
    } catch(e) {
      console.error("Erro ao salvar no Sheets:", e);
      mostrarNotify('err', 'Falha ao salvar. Verifique sua conexão.');
    }
  }
};

var MENU_PERFIL = {
  predial:'predial', frota:'frota', veiculos:'frota', avarias:'frota',
  documentos:'documentos', indicadores:'predial',
  checklist:['predial','frota'],
  sharepoint:'__admin__', usuarios:'__admin__', importar:['predial','frota']
};
async function sha256Hex(txt){
  var buf = new TextEncoder().encode(String(txt));
  var hashBuf = await crypto.subtle.digest('SHA-256', buf);
  return Array.prototype.map.call(new Uint8Array(hashBuf), function(b){ return ('00'+b.toString(16)).slice(-2); }).join('');
}
function ehAdmin(user){ return !!(user && Array.isArray(user.perfil) && user.perfil.indexOf('admin')>-1); }
function podeAcessarMenu(menu, user){
  if(!user) return false;
  if(ehAdmin(user)) return true;
  var req = MENU_PERFIL[menu];
  if(!req) return true; // dashboard, relatorios, estatisticas: liberado a qualquer usuário logado
  if(req === '__admin__') return false;
  if(Array.isArray(req)) return req.some(function(r){ return user.perfil.indexOf(r)>-1; });
  return user.perfil.indexOf(req)>-1;
}

async function doLogin(){
  var usuario = document.getElementById('lg-usuario').value.trim();
  var senha = document.getElementById('lg-senha').value;
  var errEl = document.getElementById('login-err');
  errEl.style.display = 'none';
  if(!usuario || !senha){ errEl.textContent = 'Informe usuário e senha.'; errEl.style.display='block'; return; }
  var btn = document.getElementById('lg-btn'); btn.disabled = true; btn.textContent = 'Entrando...';
  var hash = await sha256Hex(senha);
  var user = state.usuarios.find(function(u){ return normalizeStr(u.usuario)===normalizeStr(usuario) && u.senhaHash===hash; });
  btn.disabled = false; btn.textContent = 'Entrar';
  if(!user){ errEl.textContent = 'Usuário ou senha inválidos.'; errEl.style.display='block'; return; }
  if(!user.ativo){ errEl.textContent = 'Este usuário está inativo. Fale com um administrador.'; errEl.style.display='block'; return; }
  state.currentUser = user;
  sessionStorage.setItem(SESSION_KEY, JSON.stringify({usuario:user.usuario, id:user.id}));
  entrarNoApp();
}

  sessionStorage.removeItem(SESSION_KEY);
  state.currentUser = null;
  document.getElementById('lg-usuario').value = '';

  var raw = sessionStorage.getItem(SESSION_KEY);
  if(!raw) return false;

function calcProxima(ultimaIso, periodicidade){
  if(!ultimaIso) return '';
  var dt = new Date(ultimaIso+'T00:00:00');
  if(PERIODO_DIAS[periodicidade]){
    dt.setDate(dt.getDate()+PERIODO_DIAS[periodicidade]);
  } else {
    var meses = PERIODO_MESES[periodicidade] || 1;
    dt.setMonth(dt.getMonth()+meses);
  }
  return dt.toISOString().slice(0,10);
}

function statusPorData(item){
  var hoje = new Date(); hoje.setHours(0,0,0,0);
  var prox = new Date((item.proximaData||item.ultimaExecucao)+'T00:00:00');
  var diffDays = Math.round((prox-hoje)/86400000);
  var janela = PERIODO_JANELA[item.periodicidade] || 10;
  if(diffDays < 0) return {key:'late', label:'Atrasada', dias:diffDays};
  if(diffDays <= janela) return {key:'warn', label:'Vencendo', dias:diffDays};
  return {key:'ok', label:'Em dia', dias:diffDays};
}

function statusPorKm(item){
  if(item.tipo!=='frota' || !item.kmIntervalo || !item.veiculoId) return null;
  var veic = encontrarVeiculo(item.veiculoId);
  if(!veic || veic.kmAtual==null || veic.kmAtual==='') return null;
  var kmUltima = parseFloat(item.kmUltima)||0;
  var kmProxima = kmUltima + parseFloat(item.kmIntervalo);
  var kmRestante = kmProxima - parseFloat(veic.kmAtual);
  var janelaKm = Math.min(1000, parseFloat(item.kmIntervalo)*0.15);
  var key = kmRestante < 0 ? 'late' : (kmRestante <= janelaKm ? 'warn' : 'ok');
  return {key:key, kmProxima:kmProxima, kmRestante:kmRestante};
}

var _ordemStatus = {late:2, warn:1, ok:0};
function statusItem(item){
  var sData = statusPorData(item);
  var sKm = statusPorKm(item);
  var pior = sData;
  if(sKm && _ordemStatus[sKm.key] > _ordemStatus[pior.key]) pior = {key:sKm.key, label:sData.label, dias:sData.dias};
  pior.km = sKm;
  if(sKm) pior.label = pior.key==='late' ? 'Atrasada' : (pior.key==='warn' ? 'Vencendo' : 'Em dia');
  return pior;
}

function passaFiltro(item){
  var statusOk = true;
  if(_filtro==='ok') statusOk = statusItem(item).key==='ok';
  else if(_filtro==='warn') statusOk = statusItem(item).key==='warn';
  else if(_filtro==='late') statusOk = statusItem(item).key==='late';
  else if(_filtro==='predial') statusOk = item.tipo==='predial';
  else if(_filtro==='frota') statusOk = item.tipo==='frota';
  else if(_filtro.indexOf('item:')===0) statusOk = item.id === _filtro.slice(5);
  if(!statusOk) return false;
  if(_filtroMes){
    if(!item.proximaData || item.proximaData.slice(0,7) !== _filtroMes) return false;
  }
  return true;
}
function setFiltro(f){ _filtro = f; renderPage(); }
function setFiltroMes(m){ _filtroMes = m; renderPage(); }

function mesesDisponiveis(itens){
  var set = {};
  itens.forEach(function(i){ if(i.proximaData) set[i.proximaData.slice(0,7)] = true; });
  return Object.keys(set).sort();
}

function contarStatus(lista){
  var c = {ok:0, warn:0, late:0};
  lista.forEach(function(i){ c[statusItem(i).key]++; });
  return c;
}

    });

  }

  _charts.push(new Chart(document.getElementById('dashChStatus'), {
    type:'doughnut',
    data:{ labels:['Em dia','Vencendo','Atrasadas'], datasets:[{ data:[cont.ok, cont.warn, cont.late], backgroundColor:[CORES.ok, CORES.warn, CORES.late] }] },
    options:{responsive:true, plugins:{legend:{position:'bottom'}}, onClick:function(evt, els){ if(els.length){ var f=['ok','warn','late'][els[0].index]; setFiltro(f); } }}
  }));

  _charts.push(new Chart(document.getElementById('dashChTipo'), {
    type:'bar',
    data:{ labels:['Predial','Frota'], datasets:[{ label:'Custo (R$)', data:[custoPredial, custoFrota], backgroundColor:[CORES.predial, CORES.frota] }] },
    options:{responsive:true, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}}, onClick:function(evt, els){ if(els.length){ var f=['predial','frota'][els[0].index]; setFiltro(f); } }}
  }));

  var meses = mesesDisponiveis(itens).slice(0,12);

    options:{responsive:true, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, ticks:{stepSize:1}}},
      onClick:function(evt, els){ if(els.length){ setFiltroMes(meses[els[0].index]); } }}
  }));
}

function renderFiltroBusca(comTipo, itensEscopo, comBusca){

  if(comBusca && _filtro.indexOf('item:')===0){

  }
  var html = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center">';
  html += '<span style="font-size:11px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em">Filtrar:</span>';
  html += '<button class="dash-filtro-btn'+(_filtro==='todos'?' on':'')+'" onclick="setFiltro(\'todos\')">Todas</button>';
  html += '<button class="dash-filtro-btn'+(_filtro==='ok'?' on':'')+'" onclick="setFiltro(\'ok\')">Em dia</button>';
  html += '<button class="dash-filtro-btn'+(_filtro==='warn'?' on':'')+'" onclick="setFiltro(\'warn\')">Vencendo</button>';
  html += '<button class="dash-filtro-btn'+(_filtro==='late'?' on':'')+'" onclick="setFiltro(\'late\')">Atrasadas</button>';
  if(comTipo){
    html += '<button class="dash-filtro-btn'+(_filtro==='predial'?' on':'')+'" onclick="setFiltro(\'predial\')">🏢 Predial</button>';
    html += '<button class="dash-filtro-btn'+(_filtro==='frota'?' on':'')+'" onclick="setFiltro(\'frota\')">🚗 Frota</button>';

  if(itensEscopo){

      + mesesOpts.map(function(m){ return '<option value="'+m+'"'+(_filtroMes===m?' selected':'')+'>'+mesLabel(m)+'</option>'; }).join('')
      + '</select>';
  }
  if(comBusca){
    html += '<div class="mnt-search-wrap" id="mntSearchWrap">'
      + '<div class="mnt-search-box">'
      + '<span class="mnt-search-icon">🔍</span>'
      + '<input type="text" class="mnt-search-input" id="mntSearchInput" placeholder="Buscar por nome, categoria ou responsável..." value="'+esc(_searchTerm)+'" oninput="onSearchInput(this.value)" onfocus="onSearchInput(this.value)" onkeydown="onSearchKeydown(event)" autocomplete="off">'
      + '<button class="mnt-search-clear" id="mntSearchClearBtn" onclick="clearSearch()" title="Limpar busca" style="'+(_searchTerm?'':'display:none')+'">✕</button>'

function searchScopeItens(){ return state.menu==='dashboard' ? todosItensUnidade() : todosItensUnidade().filter(function(i){ return i.tipo===state.menu; }); }
function itemSearchMatches(term){
  var t = normalizeStr(term).trim();
  if(!t) return [];
  return searchScopeItens().filter(function(i){
    return normalizeStr(i.ativo).indexOf(t)>-1 || normalizeStr(i.categoria).indexOf(t)>-1 || normalizeStr(i.responsavel).indexOf(t)>-1;
  });
}
function renderSearchDropAtual(){ renderSearchDrop(_searchTerm); }
function renderSearchDrop(term){
  var drop = document.getElementById('mntSearchDrop');
  if(!drop) return;
  var t = (term||'').trim();
  _searchHl = -1;
  if(!t){ drop.innerHTML=''; return; }
  var results = itemSearchMatches(t);
  if(results.length===0){
    drop.innerHTML = '<div class="mnt-search-drop"><div class="mnt-search-empty">Nenhum item encontrado para "'+esc(t)+'"</div></div>';
    return;
  }
  var html = '<div class="mnt-search-drop" id="mntSearchDropInner">';
  html += '<div class="mnt-search-count">'+results.length+(results.length===1?' resultado':' resultados')+'</div>';
  results.slice(0,30).forEach(function(it,i){
    var st = statusItem(it);
    html += '<div class="mnt-search-item" data-idx="'+i+'" onmouseenter="searchSetHl('+i+')" onclick="selectSearch(\''+esc(it.id)+'\')">'
      + '<span>'+tipoIcon(it.tipo)+'</span>'
      + '<span>'+esc(it.ativo)+'</span>'
      + '<span class="msi-status" style="color:'+(st.key==='ok'?'var(--ok)':st.key==='warn'?'var(--warn)':'var(--err)')+'">'+st.label+'</span>'
      + '</div>';
  });
  html += '</div>';
  drop.innerHTML = html;
}
function onSearchInput(val){
  _searchTerm = val;
  var btn = document.getElementById('mntSearchClearBtn');
  if(btn) btn.style.display = val ? '' : 'none';
  renderSearchDrop(val);
}
function searchSetHl(idx){
  _searchHl = idx;
  document.querySelectorAll('#mntSearchDropInner .mnt-search-item').forEach(function(el){ el.classList.remove('hl'); });
  var items = document.querySelectorAll('#mntSearchDropInner .mnt-search-item');
  if(items[idx]) items[idx].classList.add('hl');
}
function selectSearch(id){ _searchTerm = ''; setFiltro('item:'+id); }
function clearSearch(){
  _searchTerm = '';
  var input = document.getElementById('mntSearchInput');
  if(input){ input.value=''; input.focus(); }
  var btn = document.getElementById('mntSearchClearBtn');
  if(btn) btn.style.display='none';
  var drop = document.getElementById('mntSearchDrop');
  if(drop) drop.innerHTML='';
}
function onSearchKeydown(ev){
  var items = document.querySelectorAll('#mntSearchDropInner .mnt-search-item');
  if(ev.key==='Escape'){ clearSearch(); return; }
  if(ev.key==='ArrowDown'){ ev.preventDefault(); if(!items.length) return; _searchHl=(_searchHl+1)%items.length; searchSetHl(_searchHl); items[_searchHl].scrollIntoView({block:'nearest'}); return; }
  if(ev.key==='ArrowUp'){ ev.preventDefault(); if(!items.length) return; _searchHl=(_searchHl-1+items.length)%items.length; searchSetHl(_searchHl); items[_searchHl].scrollIntoView({block:'nearest'}); return; }
  if(ev.key==='Enter'){
    ev.preventDefault();
    var results = itemSearchMatches(_searchTerm);
    var pick = (_searchHl>-1 && results[_searchHl]) ? results[_searchHl] : results[0];
    if(pick) selectSearch(pick.id);
    return;
  }
}
document.addEventListener('click', function(ev){
  var wrap = document.getElementById('mntSearchWrap');
  if(!wrap) return;
  if(!wrap.contains(ev.target)){ var drop = document.getElementById('mntSearchDrop'); if(drop) drop.innerHTML=''; }
});

function renderListaCards(lista){
  if(lista.length===0){
    return '<div class="empty-state"><div class="es-ic">🗂️</div><div class="es-txt">Nenhuma manutenção encontrada para este filtro.</div></div>';
  }
  lista = lista.slice().sort(function(a,b){ return new Date(a.proximaData) - new Date(b.proximaData); });
  var html = '<div class="mnt-list">';
  lista.forEach(function(it){
    var st = statusItem(it);
    html += '<div class="mnt-card st-'+st.key+'">'
      + '<div class="mnt-top">'
      + '<div class="mnt-titlewrap"><span class="mnt-tipico">'+tipoIcon(it.tipo)+'</span><span class="mnt-nome">'+esc(it.ativo)+'</span><span class="mnt-cat">• '+esc(it.categoria)+' • '+esc(it.periodicidade)+'</span></div>'
      + '<span class="badge badge-'+st.key+'">'+st.label+'</span>'
      + '</div>'
      + '<div class="mnt-grid">'
      + '<div><div class="mnt-field-lbl">Próxima data</div><div class="mnt-field-val '+(st.key==='late'?'late':st.key==='warn'?'warn':'')+'">'+fmtData(it.proximaData)+'</div></div>'
      + '<div><div class="mnt-field-lbl">Última execução</div><div class="mnt-field-val">'+fmtData(it.ultimaExecucao)+'</div></div>'
      + '<div><div class="mnt-field-lbl">Responsável</div><div class="mnt-field-val">'+esc(it.responsavel||'—')+'</div></div>'
      + '<div><div class="mnt-field-lbl">Custo</div><div class="mnt-field-val">'+fmtVal(it.valor)+'</div></div>'
      + '</div>'
      + (it.local ? '<div class="mnt-field-lbl">Local: <span style="color:var(--txt2);text-transform:none;font-weight:600">'+esc(it.local)+'</span></div>' : '')
      + renderKmChip(it, st)
      + (it.obs ? '<div class="mnt-obs">'+esc(it.obs)+'</div>' : '')
      + '<div class="mnt-actions">'
      + '<button class="btn-mini-g" onclick="registrarExecucao(\''+esc(it.id)+'\')">🔁 Registrar execução</button>'
      + '<button class="btn-mini" onclick="abrirModalEditar(\''+esc(it.id)+'\')">✏️ Editar</button>'
      + '<button class="btn-danger" onclick="excluirItem(\''+esc(it.id)+'\')">🗑️ Excluir</button>'
      + '</div>'
      + '</div>';
  });
  html += '</div>';
  return html;
}

function renderKmChip(it, st){
  if(!st.km) return '';
  var veic = encontrarVeiculo(it.veiculoId);
  var restTxt = st.km.kmRestante < 0 ? Math.abs(Math.round(st.km.kmRestante)).toLocaleString('pt-BR')+' km atrasado' : 'faltam '+Math.round(st.km.kmRestante).toLocaleString('pt-BR')+' km';
  return '<div class="mnt-km-row"><span class="km-chip '+st.km.key+'">🛣️ '+(veic?esc(veic.placa)+' • ':'')+'próxima em '+Math.round(st.km.kmProxima).toLocaleString('pt-BR')+' km ('+restTxt+')</span></div>';
}

function preencherCategorias(tipo, selecionada){
  var sel = document.getElementById('mi-categoria');
  sel.innerHTML = CATEGORIAS[tipo].map(function(c){ return '<option'+(c===selecionada?' selected':'')+'>'+esc(c)+'</option>'; }).join('');
}
function preencherVeiculosSelect(selecionado){
  var sel = document.getElementById('mi-veiculo');
  if(!sel) return;
  var opts = '<option value="">— nenhum / não se aplica —</option>' + todosVeiculosUnidade().map(function(v){
    return '<option value="'+esc(v.id)+'"'+(v.id===selecionado?' selected':'')+'>'+esc(v.placa)+(v.modelo?' — '+esc(v.modelo):'')+'</option>';
  }).join('');

}
function toggleFrotaCampos(tipo){
  var mostrar = tipo==='frota';
  document.querySelectorAll('.frota-only').forEach(function(el){ el.classList[mostrar?'add':'remove']('show'); });
  if(mostrar) preencherVeiculosSelect(document.getElementById('mi-veiculo') ? document.getElementById('mi-veiculo').value : '');
}
function onTipoChange(){
  var tipo = document.getElementById('mi-tipo').value;
  preencherCategorias(tipo, null);
  toggleFrotaCampos(tipo);
  sugerirKmPadrao();
}
function sugerirProxima(){
  var ultima = document.getElementById('mi-ultima').value;
  var periodicidade = document.getElementById('mi-periodicidade').value;
  var proximaEl = document.getElementById('mi-proxima');
  if(ultima && (!proximaEl.value || proximaEl.dataset.auto==='1')){
    proximaEl.value = calcProxima(ultima, periodicidade);
    proximaEl.dataset.auto = '1';
  }
}
function sugerirKmPadrao(){
  var cat = document.getElementById('mi-categoria').value;
  var kmInt = document.getElementById('mi-kmintervalo');
  if(kmInt && !kmInt.value && KM_PADRAO[cat]) kmInt.value = KM_PADRAO[cat];
  atualizarKmProximaPreview();
}
function atualizarKmProximaPreview(){
  var kmU = parseFloat(document.getElementById('mi-kmultima').value);
  var kmI = parseFloat(document.getElementById('mi-kmintervalo').value);
  var out = document.getElementById('mi-kmproxima');
  if(out) out.value = (!isNaN(kmU) && !isNaN(kmI)) ? (kmU+kmI).toLocaleString('pt-BR')+' km' : '—';
}
function tiposPermitidos(){
  var user = state.currentUser;
  if(ehAdmin(user)) return ['predial','frota'];
  var out = [];
  if(user.perfil.indexOf('predial')>-1) out.push('predial');
  if(user.perfil.indexOf('frota')>-1) out.push('frota');
  return out;
}
function abrirModalNovo(){
  var permitidos = tiposPermitidos();
  if(!permitidos.length){ mostrarNotify('err','Seu perfil não tem permissão para cadastrar manutenções.'); return; }
  document.getElementById('modal-item-titulo').textContent = '🔧 Nova manutenção';
  document.getElementById('mi-id').value = '';
  var tipoPadrao = (state.menu==='predial'||state.menu==='frota') ? state.menu : permitidos[0];
  if(permitidos.indexOf(tipoPadrao)===-1) tipoPadrao = permitidos[0];
  var selTipo = document.getElementById('mi-tipo');
  Array.prototype.forEach.call(selTipo.options, function(opt){ opt.hidden = permitidos.indexOf(opt.value)===-1; });
  selTipo.value = tipoPadrao;
  document.getElementById('mi-tipo').disabled = (state.menu==='predial'||state.menu==='frota') || permitidos.length===1;
  preencherCategorias(tipoPadrao, null);
  document.getElementById('mi-ativo').value = '';
  document.getElementById('mi-local').value = '';
  document.getElementById('mi-periodicidade').value = 'Trimestral';
  var hoje = new Date().toISOString().slice(0,10);
  document.getElementById('mi-ultima').value = hoje;
  var proximaEl = document.getElementById('mi-proxima');
  proximaEl.value = calcProxima(hoje, 'Trimestral');
  proximaEl.dataset.auto = '1';
  document.getElementById('mi-responsavel').value = '';
  document.getElementById('mi-valor').value = '';
  document.getElementById('mi-obs').value = '';
  document.getElementById('mi-kmultima').value = '';
  document.getElementById('mi-kmintervalo').value = '';
  document.getElementById('mi-kmproxima').value = '—';
  toggleFrotaCampos(tipoPadrao);
  preencherVeiculosSelect('');
  document.getElementById('modal-item').style.display = 'flex';
}
function abrirModalEditar(id){
  var it = encontrarItem(id);
  if(!it) return;
  document.getElementById('modal-item-titulo').textContent = '✏️ Editar manutenção';
  document.getElementById('mi-id').value = it.id;
  document.getElementById('mi-tipo').value = it.tipo;
  document.getElementById('mi-tipo').disabled = false;
  preencherCategorias(it.tipo, it.categoria);
  document.getElementById('mi-ativo').value = it.ativo;
  document.getElementById('mi-local').value = it.local||'';
  document.getElementById('mi-periodicidade').value = it.periodicidade;
  document.getElementById('mi-ultima').value = it.ultimaExecucao||'';
  var proximaEl = document.getElementById('mi-proxima');
  proximaEl.value = it.proximaData||'';
  proximaEl.dataset.auto = '0';
  document.getElementById('mi-responsavel').value = it.responsavel||'';
  document.getElementById('mi-valor').value = it.valor||'';
  document.getElementById('mi-obs').value = it.obs||'';
  toggleFrotaCampos(it.tipo);
  preencherVeiculosSelect(it.veiculoId||'');
  document.getElementById('mi-veiculo').value = it.veiculoId||'';
  document.getElementById('mi-kmultima').value = it.kmUltima!=null ? it.kmUltima : '';
  document.getElementById('mi-kmintervalo').value = it.kmIntervalo!=null ? it.kmIntervalo : '';
  atualizarKmProximaPreview();
  document.getElementById('modal-item').style.display = 'flex';
}
function fecharModalItem(){ document.getElementById('modal-item').style.display = 'none'; }

function salvarItem(){
  var id = document.getElementById('mi-id').value;
  var ativo = document.getElementById('mi-ativo').value.trim();
  var ultima = document.getElementById('mi-ultima').value;
  var proxima = document.getElementById('mi-proxima').value;
  var valor = parseFloat(document.getElementById('mi-valor').value)||0;
  var tipo = document.getElementById('mi-tipo').value;

  if(!ativo){ mostrarNotify('err','Informe o nome do ativo.'); return; }
  if(!proxima){ mostrarNotify('err','Informe a próxima data prevista.'); return; }
  if(valor < 0){ mostrarNotify('err','O custo não pode ser negativo.'); return; }
  if(ultima && proxima && new Date(proxima) < new Date(ultima)){
    mostrarNotify('err','A próxima execução não pode ser anterior à última.'); return; 
  }
  if(tipo === 'frota'){
      var kmU = document.getElementById('mi-kmultima').value;
      var kmI = document.getElementById('mi-kmintervalo').value;
      if(kmU !== '' && parseFloat(kmU) < 0) { mostrarNotify('err', 'KM inválido.'); return; }
      if(kmI !== '' && parseFloat(kmI) < 0) { mostrarNotify('err', 'Intervalo inválido.'); return; }
  }

  var dados = {
    tipo: tipo,
    ativo: ativo,
    categoria: document.getElementById('mi-categoria').value,
    local: document.getElementById('mi-local').value.trim(),
    periodicidade: document.getElementById('mi-periodicidade').value,
    ultimaExecucao: ultima,
    proximaData: proxima,
    responsavel: document.getElementById('mi-responsavel').value.trim(),
    valor: valor,
    obs: document.getElementById('mi-obs').value.trim(),
    veiculoId: tipo==='frota' ? document.getElementById('mi-veiculo').value : '',
    kmUltima: tipo==='frota' && document.getElementById('mi-kmultima').value!=='' ? parseFloat(document.getElementById('mi-kmultima').value) : null,
    kmIntervalo: tipo==='frota' && document.getElementById('mi-kmintervalo').value!=='' ? parseFloat(document.getElementById('mi-kmintervalo').value) : null
  };
  
  if(id){
    var it = encontrarItem(id);
    if(it) Object.assign(it, dados);
    mostrarNotify('ok','Manutenção atualizada!');
  } else {
    dados.id = uid();
    state.itens[state.unit].push(dados);
    mostrarNotify('ok','Manutenção cadastrada!');
  }
  
  saveState();
  fecharModalItem();
  renderPage();
}

function registrarExecucao(id){
  var it = encontrarItem(id);
  if(!it) return;
  var hoje = new Date().toISOString().slice(0,10);
  it.ultimaExecucao = hoje;
  it.proximaData = calcProxima(hoje, it.periodicidade);
  saveState();
  renderPage();
  mostrarNotify('ok','Execução registrada! Próxima: '+fmtData(it.proximaData));
}

function excluirItem(id){
  var it = encontrarItem(id);
  if(!it) return;
  if(!confirm('Excluir a manutenção "'+esc(it.ativo)+'"?')) return;
  state.itens[state.unit] = state.itens[state.unit].filter(function(i){ return i.id!==id; });
  excluirNaPlanilha('itens', id);
  saveState();
  renderPage();
  mostrarNotify('ok','Manutenção excluída.');
}

function abrirModalVeiculo(id){

  document.getElementById('mv-id').value = v ? v.id : '';
  document.getElementById('mv-placa').value = v ? v.placa : '';
  document.getElementById('mv-modelo').value = v ? (v.modelo||'') : '';
  document.getElementById('mv-km').value = v ? v.kmAtual : '';

function fecharModalVeiculo(){ document.getElementById('modal-veiculo').style.display = 'none'; }
function salvarVeiculo(){
  var id = document.getElementById('mv-id').value;
  var placa = document.getElementById('mv-placa').value.trim();
  var km = document.getElementById('mv-km').value;
  if(!placa){ mostrarNotify('err','Informe a placa do veículo.'); return; }
  if(km===''){ mostrarNotify('err','Informe o KM atual.'); return; }
  var hoje = new Date().toISOString().slice(0,10);
  if(id){
    var v = encontrarVeiculo(id);
    if(v){ v.placa=placa; v.modelo=document.getElementById('mv-modelo').value.trim(); v.kmAtual=parseFloat(km)||0; v.atualizadoEm=hoje; }
    mostrarNotify('ok','Veículo atualizado!');
  } else {
    state.veiculos[state.unit].push({id:'v'+uid(), placa:placa, modelo:document.getElementById('mv-modelo').value.trim(), kmAtual:parseFloat(km)||0, atualizadoEm:hoje});
    mostrarNotify('ok','Veículo cadastrado!');
  }
  saveState();
  fecharModalVeiculo();
  renderPage();
}
function excluirVeiculo(id){
  var v = encontrarVeiculo(id);
  if(!v) return;
  if(!confirm('Excluir o veículo "'+esc(v.placa)+'"? Manutenções vinculadas perderão o vínculo de KM.')) return;
  state.veiculos[state.unit] = state.veiculos[state.unit].filter(function(x){ return x.id!==id; });
  todosItensUnidade().forEach(function(i){ if(i.veiculoId===id) i.veiculoId=''; });
  excluirNaPlanilha('veiculos', id);
  saveState();
  renderPage();
  mostrarNotify('ok','Veículo excluído.');
}
function atualizarKmVeiculo(id){
  var v = encontrarVeiculo(id);
  var input = document.getElementById('vkm-'+id);
  if(!v || !input) return;
  var novo = parseFloat(input.value);
  if(isNaN(novo) || novo<0){ mostrarNotify('err','KM inválido.'); return; }
  v.kmAtual = novo;
  v.atualizadoEm = new Date().toISOString().slice(0,10);
  saveState();
  renderPage();
  mostrarNotify('ok','KM atualizado.');
}

var _avariaFotoAtual = null;
function comprimirImagem(file, maxLado, qualidade){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        if(w > h && w > maxLado){ h = Math.round(h * maxLado / w); w = maxLado; }
        else if(h > maxLado){ w = Math.round(w * maxLado / h); h = maxLado; }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', qualidade));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function onAvariaFotoSelecionada(input){
  var file = input.files[0];
  if(!file) return;
  var lbl = document.getElementById('av-foto-lbl');
  if(SCRIPT_URL === 'SUA_URL_DO_APPS_SCRIPT_AQUI'){
    mostrarNotify('err','Configure a conexão com o Google Sheets/Drive em "Integrações" antes de anexar fotos — sem isso a foto não pode ser salva.');
    input.value = '';
    return;
  }
  lbl.textContent = 'Processando...';
  comprimirImagem(file, 1000, 0.6).then(function(dataUrl){
    var prev = document.getElementById('av-foto-preview');
    prev.src = dataUrl; prev.style.display = 'block';
    lbl.textContent = 'Enviando ao Drive...';
    var base64 = dataUrl.split(',')[1];
    return fetch(SCRIPT_URL, {
      method:'POST',
      body: JSON.stringify({
        action:'uploadFile', filename:'avaria_'+Date.now()+'.jpg', mimeType:'image/jpeg',
        dataBase64: base64, pasta: 'FotosAvarias/' + state.unit
      })
    }).then(function(r){ return r.json(); });
  }).then(function(j){
    if(j && j.ok && j.url){
      _avariaFotoAtual = j.url;
      lbl.textContent = 'Foto anexada ✓';
    } else {
      throw new Error((j && j.error) || 'Falha desconhecida ao enviar ao Drive.');
    }
  }).catch(function(err){
    lbl.textContent = 'Tirar/anexar';
    document.getElementById('av-foto-preview').style.display = 'none';
    mostrarNotify('err','Não foi possível enviar a foto: '+err.message);
  });
}

function removerAvaria(idx){ _checklistDraft.avarias.splice(idx,1); renderChecklist(); }
function salvarChecklist(){
  if(!_checklistDraft.ref){ mostrarNotify('err','Selecione a referência.'); return; }
  if(!_checklistDraft.responsavel){ mostrarNotify('err','Informe o responsável.'); return; }
  if(_checklistDraft.tipo==='frota' && !_checklistDraft.kmVistoria){ mostrarNotify('err','Informe o KM registrado.'); return; }
  var pendente = _checklistDraft.itens.some(function(i){ return !i.status; });
  if(pendente){ mostrarNotify('err','Preencha o status de todos os itens.'); return; }
  
  var refLabel = '';
  if(_checklistDraft.tipo==='frota'){ var v = encontrarVeiculo(_checklistDraft.ref); refLabel = v ? v.placa+(v.modelo?' — '+v.modelo:'') : ''; }
  else { var it = encontrarItem(_checklistDraft.ref); refLabel = it ? it.ativo : ''; }
  
  var registro = {
    id:uid(), tipo:_checklistDraft.tipo, ref:_checklistDraft.ref, refLabel:refLabel, data:_checklistDraft.data,
    responsavel:_checklistDraft.responsavel, kmVistoria: _checklistDraft.tipo==='frota' ? parseFloat(_checklistDraft.kmVistoria) : null,
    itens:JSON.parse(JSON.stringify(_checklistDraft.itens)), avarias:JSON.parse(JSON.stringify(_checklistDraft.avarias)), criadoEm:new Date().toISOString()
  };
  
  state.checklists[state.unit].push(registro);
  
  if(_checklistDraft.tipo==='frota' && _checklistDraft.ref){
    var veic = encontrarVeiculo(_checklistDraft.ref);
    var kmNovo = parseFloat(_checklistDraft.kmVistoria);
    if(veic && kmNovo > parseFloat(veic.kmAtual||0)){
      if(confirm('Atualizar odômetro do veículo para '+kmNovo.toLocaleString('pt-BR')+' km?')){
        veic.kmAtual = kmNovo; veic.atualizadoEm = _checklistDraft.data;
      }
    }
  }
  saveState();
  novoChecklistDraft(_checklistDraft.tipo);
  renderChecklist();
  mostrarNotify('ok','Checklist arquivado com sucesso!');
}
function excluirChecklist(id){
  if(!confirm('Excluir este checklist?')) return;
  state.checklists[state.unit] = state.checklists[state.unit].filter(function(c){ return c.id!==id; });
  excluirNaPlanilha('checklists', id);
  saveState();
  renderChecklist();
  mostrarNotify('ok','Checklist excluído.');
}

function coletarItensRelatorio(){
  var escopo = document.getElementById('rp-escopo').value;
  var tipo = document.getElementById('rp-tipo').value;
  var unidadesAlvo = escopo==='todas' ? UNIDADES : [state.unit];
  var lista = [];
  unidadesAlvo.forEach(function(u){
    (state.itens[u]||[]).forEach(function(i){
      if(tipo!=='ambos' && i.tipo!==tipo) return;
      lista.push(Object.assign({}, i, {_unidade:u}));
    });
  });
  return {lista:lista, unidadesAlvo:unidadesAlvo, tipo:tipo, escopo:escopo};
}
function statusItemUnidade(item, unidade){
  var unidOrig = state.unit;
  state.unit = unidade;
  var st = statusItem(item);
  state.unit = unidOrig;
  return st;
}
function gerarRelatorio(modo){
  var col = coletarItensRelatorio();
  var lista = col.lista;
  var custoTotal = lista.reduce(function(a,i){ return a+(parseFloat(i.valor)||0); },0);
  var custoPredial = lista.filter(function(i){return i.tipo==='predial';}).reduce(function(a,i){return a+(parseFloat(i.valor)||0);},0);
  var custoFrota = lista.filter(function(i){return i.tipo==='frota';}).reduce(function(a,i){return a+(parseFloat(i.valor)||0);},0);
  var cont = {ok:0,warn:0,late:0};
  lista.forEach(function(i){ cont[statusItemUnidade(i,i._unidade).key]++; });

  var tipoLbl = col.tipo==='ambos' ? 'Predial + Frota' : (col.tipo==='predial' ? 'Predial' : 'Frota');
  var escopoLbl = col.escopo==='todas' ? 'Todas as unidades' : esc(state.unit);

  var html = '<div class="rp-header"><div class="rp-header-left"><img class="rp-logo" src="'+LOGO_B64+'" alt="Unimed Vale do Sepotuba"><div><div class="rp-title">Relatório '+(modo==='sintetico'?'Sintético':'Analítico')+' de Manutenção Preventiva</div>'
    + '<div class="rp-sub">'+tipoLbl+' • '+escopoLbl+'</div></div></div>'
    + '<div class="rp-meta">Gerado em: '+fmtData(new Date().toISOString().slice(0,10))+'<br>Total de itens: '+lista.length+'</div></div>';

  html += '<div class="rp-kpis">'
    + '<div class="rp-kpi"><b>'+fmtVal(custoTotal)+'</b><span>Custo total</span></div>'
    + '<div class="rp-kpi"><b>'+fmtVal(custoPredial)+'</b><span>Custo predial</span></div>'
    + '<div class="rp-kpi"><b>'+fmtVal(custoFrota)+'</b><span>Custo frota</span></div>'
    + '<div class="rp-kpi"><b>'+cont.ok+'</b><span>Em dia</span></div>'
    + '<div class="rp-kpi"><b>'+cont.warn+'</b><span>Vencendo</span></div>'
    + '<div class="rp-kpi"><b>'+cont.late+'</b><span>Atrasadas</span></div>'
    + '</div>';

  if(modo==='sintetico'){
    var porCategoria = {};
    lista.forEach(function(i){
      var k = i.tipo+' — '+i.categoria;
      if(!porCategoria[k]) porCategoria[k] = {qtd:0, custo:0};
      porCategoria[k].qtd++; porCategoria[k].custo += (parseFloat(i.valor)||0);
    });
    html += '<div class="rp-section-title">Resumo por categoria</div>';
    html += '<table class="rp-table"><thead><tr><th>Categoria</th><th>Qtd. de itens</th><th>Custo total</th></tr></thead><tbody>';
    Object.keys(porCategoria).sort().forEach(function(k){
      html += '<tr><td>'+esc(k)+'</td><td>'+porCategoria[k].qtd+'</td><td>'+fmtVal(porCategoria[k].custo)+'</td></tr>';
    });
    html += '</tbody></table>';
    if(col.escopo==='todas'){
      html += '<div class="rp-section-title">Resumo por unidade</div>';
      html += '<table class="rp-table"><thead><tr><th>Unidade</th><th>Qtd.</th><th>Em dia</th><th>Vencendo</th><th>Atrasadas</th><th>Custo</th></tr></thead><tbody>';
      col.unidadesAlvo.forEach(function(u){
        var itsU = lista.filter(function(i){return i._unidade===u;});
        var cU = {ok:0,warn:0,late:0};
        itsU.forEach(function(i){ cU[statusItemUnidade(i,u).key]++; });
        var custoU = itsU.reduce(function(a,i){return a+(parseFloat(i.valor)||0);},0);
        html += '<tr><td>'+esc(u)+'</td><td>'+itsU.length+'</td><td>'+cU.ok+'</td><td>'+cU.warn+'</td><td>'+cU.late+'</td><td>'+fmtVal(custoU)+'</td></tr>';
      });
      html += '</tbody></table>';
    }
  } else {
    html += '<div class="rp-section-title">Detalhamento analítico</div>';
    html += '<table class="rp-table"><thead><tr>'
      + (col.escopo==='todas'?'<th>Unidade</th>':'')
      + '<th>Tipo</th><th>Ativo</th><th>Categoria</th><th>Periodicidade</th><th>Última exec.</th><th>Próxima data</th>'
      + (col.tipo!=='predial'?'<th>KM próxima</th>':'')
      + '<th>Status</th><th>Responsável</th><th>Custo</th><th>Obs.</th></tr></thead><tbody>';
    lista.sort(function(a,b){ return new Date(a.proximaData)-new Date(b.proximaData); }).forEach(function(i){
      var st = statusItemUnidade(i, i._unidade);
      var kmTxt = (i.tipo==='frota' && st.km) ? Math.round(st.km.kmProxima).toLocaleString('pt-BR')+' km' : (i.tipo==='frota' ? '—' : '');

        + '<td>'+(i.tipo==='predial'?'Predial':'Frota')+'</td><td>'+esc(i.ativo)+'</td><td>'+esc(i.categoria)+'</td><td>'+esc(i.periodicidade)+'</td>'
        + '<td>'+fmtData(i.ultimaExecucao)+'</td><td>'+fmtData(i.proximaData)+'</td>'
        + (col.tipo!=='predial'?'<td>'+kmTxt+'</td>':'')
        + '<td>'+st.label+'</td><td>'+esc(i.responsavel||'—')+'</td><td>'+fmtVal(i.valor)+'</td><td>'+esc(i.obs||'—')+'</td></tr>';
    });
    html += '</tbody></table>';

  html += '<div class="rp-footer">Documento gerado automaticamente pelo sistema de Manutenção.</div>';
  abrirPrintArea(html);
}

function statusDoc(vencimentoIso){
  if(!vencimentoIso) return {key: 'ok', label: 'Vigente'};
  var hoje = new Date(); hoje.setHours(0,0,0,0);
  var venc = new Date(vencimentoIso+'T00:00:00');
  var diffDays = Math.round((venc-hoje)/86400000);
  
  if(diffDays < 0) return {key: 'late', label: 'Vencido', dias: diffDays};
  if(diffDays <= 30) return {key: 'warn', label: 'A Vencer', dias: diffDays};
  return {key: 'ok', label: 'Vigente', dias: diffDays};
}

function todosDocumentosGeral(){
  var lista = [];
  UNIDADES.forEach(function(u){
    (state.documentos[u]||[]).forEach(function(d){
      lista.push(Object.assign({}, d, {_unidadeLabel: u}));
    });
  });
  return lista;
}

function setDocEscopo(esc_){ _docEscopo = esc_; _docFiltro = 'todos'; renderDocumentos(); }

function passaFiltroDoc(d){

}

  return '<div class="mnt-card st-'+st.key+'">'

    + '</div><span class="badge badge-'+st.key+'">'+st.label+'</span></div>'

    + '<div><div class="mnt-field-lbl">Vencimento</div><div class="mnt-field-val '+(st.key==='late'?'late':st.key==='warn'?'warn':'')+'">'+fmtData(d.vencimento)+' <span style="font-size:10px;font-weight:400">('+diasTxt+')</span></div></div>'
    + '<div><div class="mnt-field-lbl">Responsável</div><div class="mnt-field-val">'+esc(d.responsavel||'—')+'</div></div>'
    + '</div>'
    + '<div class="mnt-actions" style="margin-top:4px">'

    + acoes
    + '</div></div>';

function renderDocumentos(){
  var geral = _docEscopo === 'geral';
  var docsBase = geral ? todosDocumentosGeral() : todosDocumentosUnidade();

  var cVenc=0, cWarn=0, cOk=0;
  docsBase.forEach(function(d){ var k = statusDoc(d.vencimento).key; if(k==='late') cVenc++; else if(k==='warn') cWarn++; else cOk++; });

  var html = '<div style="display:flex;justify-content:space-between;margin-bottom:14px;align-items:center;flex-wrap:wrap;gap:10px">'
    + '<div class="segmented">'
    + '<button class="seg-btn'+(!geral?' on':'')+'" onclick="setDocEscopo(\'unidade\')">📍 '+esc(state.unit)+'</button>'
    + '<button class="seg-btn'+(geral?' on':'')+'" onclick="setDocEscopo(\'geral\')">🌐 Todas as unidades (alerta geral)</button>'
    + '</div>'
    + (!geral ? '<button class="btn-g" onclick="abrirModalDoc()">+ Novo Documento</button>' : '')
    + '</div>';

  function kpiAct(f){ return _docFiltro===f ? 'kpi-card kpi-active' : 'kpi-card'; }
  html += '<div class="dash-grid" style="margin-bottom:18px">'
    + '<div class="'+kpiAct('todos')+'" onclick="setDocFiltro(\'todos\')"><div class="kpi-icon">⚖️</div><div class="kpi-val">'+docsBase.length+'</div><div class="kpi-lbl">Total'+(geral?' (todas unidades)':'')+'</div><div class="kpi-hint">clique para ver todos</div></div>'
    + '<div class="'+kpiAct('ok')+'" onclick="setDocFiltro(\'ok\')"><div class="kpi-icon">✅</div><div class="kpi-val">'+cOk+'</div><div class="kpi-lbl">Vigentes</div><div class="kpi-hint">clique para filtrar</div></div>'
    + '<div class="'+kpiAct('warn')+'" onclick="setDocFiltro(\'warn\')"><div class="kpi-icon">⏳</div><div class="kpi-val">'+cWarn+'</div><div class="kpi-lbl">A vencer (≤30 dias)</div><div class="kpi-hint">clique para filtrar</div></div>'
    + '<div class="'+kpiAct('late')+'" onclick="setDocFiltro(\'late\')"><div class="kpi-icon">🚨</div><div class="kpi-val">'+cVenc+'</div><div class="kpi-lbl">Vencidos</div><div class="kpi-hint">clique para filtrar</div></div>'
    + '</div>';

  if(geral && (cVenc>0 || cWarn>0)){
    html += '<div class="alert-bar '+(cVenc>0?'st-late':'st-warn')+'">🔔 <b>'+(cVenc>0 ? cVenc+' documento(s) vencido(s)' : '')+(cVenc>0 && cWarn>0 ? ' e ' : '')+(cWarn>0 ? cWarn+' a vencer nos próximos 30 dias' : '')+'</b>, somando todas as unidades. Use os cartões abaixo para localizar e regularizar.</div>';
  }

  var docs = docsBase.filter(passaFiltroDoc);
  if(docs.length===0){
    html += '<div class="empty-state"><div class="es-ic">⚖️</div><div class="es-txt">'+(geral ? 'Nenhum documento legal cadastrado em nenhuma unidade.' : 'Nenhum documento legal cadastrado nesta unidade.')+'</div></div>';
  } else {
    docs.sort(function(a,b){ return new Date(a.vencimento) - new Date(b.vencimento); });
    html += '<div class="mnt-list">';
    docs.forEach(function(d){ html += renderDocCard(d, geral); });
    html += '</div>';
  }
  document.getElementById('content').innerHTML = html;
}

function uploadDocumentoDrive(){
  var fileInput = document.getElementById('md-arquivo');
  var statusEl = document.getElementById('md-upload-status');
  var file = fileInput.files[0];
  if(!file){ statusEl.textContent = 'Selecione um arquivo primeiro.'; statusEl.style.color = 'var(--err)'; return; }
  if(SCRIPT_URL === 'SUA_URL_DO_APPS_SCRIPT_AQUI'){ statusEl.textContent = 'Configure a conexão com o Google Sheets/Drive em "Integrações" antes de enviar arquivos.'; statusEl.style.color = 'var(--err)'; return; }
  var btn = document.getElementById('md-upload-btn'); btn.disabled = true; btn.textContent = '⏳ Enviando...';
  statusEl.style.color = 'var(--txt3)'; statusEl.textContent = 'Enviando arquivo para o Drive...';
  var reader = new FileReader();
  reader.onload = function(){
    var base64 = reader.result.split(',')[1];
    fetch(SCRIPT_URL, {
      method:'POST',
      body: JSON.stringify({
        action:'uploadFile', filename:file.name, mimeType: file.type || 'application/octet-stream',
        dataBase64: base64, pasta: 'DocumentacaoLegal/' + state.unit
      })
    }).then(function(r){ return r.json(); }).then(function(j){
      if(j && j.ok && j.url){
        document.getElementById('md-link').value = j.url;
        statusEl.style.color = 'var(--ok)';
        statusEl.textContent = '✅ Arquivo enviado e link preenchido: ' + file.name;
      } else {
        throw new Error((j && j.error) || 'Falha desconhecida.');
      }
    }).catch(function(err){
      statusEl.style.color = 'var(--err)';
      statusEl.textContent = '❌ ' + err.message + ' (verifique se o Apps Script foi atualizado com o suporte a upload de arquivos)';
    }).finally(function(){ btn.disabled = false; btn.textContent = '⬆️ Enviar'; });
  };
  reader.readAsDataURL(file);
}
function salvarDocumento(){
  var id = document.getElementById('md-id').value;
  var desc = document.getElementById('md-desc').value.trim();
  var orgao = document.getElementById('md-orgao').value.trim();
  var venc = document.getElementById('md-venc').value;
  if(!desc){ mostrarNotify('err', 'Informe a descrição do documento.'); return; }
  if(!orgao){ mostrarNotify('err', 'Informe o órgão ou fornecedor.'); return; }
  if(!venc){ mostrarNotify('err', 'Informe a data de vencimento.'); return; }
  
  var dados = {
    tipo: document.getElementById('md-tipo').value,
    descricao: desc,
    orgao: orgao,
    responsavel: document.getElementById('md-resp').value.trim(),
    emissao: document.getElementById('md-emissao').value,
    vencimento: venc,
    link: document.getElementById('md-link').value.trim()
  };
  
  if(id){
    var d = encontrarDocumento(id);
    if(d) Object.assign(d, dados);
    mostrarNotify('ok', 'Documento atualizado!');
  } else {
    dados.id = uid();
    state.documentos[state.unit].push(dados);

  }
  
  saveState();

}
function excluirDocumento(id){

function mesLabel(mesIso){
  if(!mesIso) return '—';
  var p = mesIso.split('-');
  var meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return meses[parseInt(p[1],10)-1] + '/' + p[0];
}
function n(v){ return parseFloat(v) || 0; }
function fmtNum(v, casas){ return (parseFloat(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:casas||0, maximumFractionDigits:casas||2}); }

function abrirModalIndicador(id){
  var d = id ? encontrarIndicador(id) : null;

  document.getElementById('mx-energiavalor').value = d ? (d.energiaValor||'') : '';
  document.getElementById('mx-aguam3').value = d ? (d.aguaM3||'') : '';
  document.getElementById('mx-aguavalor').value = d ? (d.aguaValor||'') : '';
  document.getElementById('mx-geracaokwh').value = d ? (d.geracaoKwh||'') : '';
  document.getElementById('mx-geracaovalor').value = d ? (d.geracaoValor||'') : '';
  document.getElementById('mx-injecaokwh').value = d ? (d.injecaoKwh||'') : '';
  document.getElementById('mx-injecaovalor').value = d ? (d.injecaoValor||'') : '';

function salvarIndicador(){
  var id = document.getElementById('mx-id').value;
  var mes = document.getElementById('mx-mes').value;
  if(!mes){ mostrarNotify('err','Selecione o mês de referência.'); return; }

  var jaExiste = todosIndicadoresUnidade().some(function(x){ return x.mes === mes && x.id !== id; });
  if(jaExiste){ mostrarNotify('err','Já existe um registro para este mês nesta unidade. Edite o registro existente.'); return; }

  var dados = {
    mes: mes,
    energiaKwh: n(document.getElementById('mx-energiakwh').value),
    energiaValor: n(document.getElementById('mx-energiavalor').value),
    aguaM3: n(document.getElementById('mx-aguam3').value),
    aguaValor: n(document.getElementById('mx-aguavalor').value),
    geracaoKwh: n(document.getElementById('mx-geracaokwh').value),
    geracaoValor: n(document.getElementById('mx-geracaovalor').value),
    injecaoKwh: n(document.getElementById('mx-injecaokwh').value),
    injecaoValor: n(document.getElementById('mx-injecaovalor').value),
    papelQtd: n(document.getElementById('mx-papelqtd').value),
    impressoes: n(document.getElementById('mx-impressoes').value),
    obs: document.getElementById('mx-obs').value.trim()
  };

  if(id){
    var it = encontrarIndicador(id);
    if(it) Object.assign(it, dados);
    mostrarNotify('ok','Registro mensal atualizado!');
  } else {
    dados.id = uid();
    state.indicadores[state.unit].push(dados);
    mostrarNotify('ok','Registro mensal cadastrado!');
  }

  saveState();
  fecharModalIndicador();
  renderPage();
}
function excluirIndicador(id){
  if(!confirm('Excluir este registro mensal?')) return;

}

function gsStatus(msg, isErr){
  var el = document.getElementById('gs-status');
  if(el) el.innerHTML = (isErr?'<span style="color:var(--err)">':'<span style="color:var(--ok)">')+msg+'</span>';
}
function salvarConfigSheets(){
  var url = document.getElementById('gs-url').value.trim();
  if(!url){ mostrarNotify('err','Informe a URL do Web App do Apps Script.'); return; }
  if(!url.startsWith('https://script.google.com/')){
    if(!confirm('A URL não parece ser um Web App do Google Apps Script (script.google.com). Deseja salvar assim mesmo?')) return;
  }
  localStorage.setItem(GS_URL_KEY, url);
  SCRIPT_URL = url;
  gsStatus('Conectando e carregando dados da planilha...');
  mostrarNotify('ok','Conexão salva. Sincronizando...');
  DB.load().then(function(ok){
    renderSharePoint();
    renderPage();
    gsStatus(ok ? '✅ Conectado e sincronizado com sucesso.' : '⚠️ Conexão salva, mas não foi possível ler dados da planilha ainda (pode estar vazia).');
  });
}
function sincronizarAgora(){
  if(SCRIPT_URL === 'SUA_URL_DO_APPS_SCRIPT_AQUI'){ mostrarNotify('err','Configure a URL do Google Sheets primeiro.'); return; }
  gsStatus('Enviando alterações...');
  DB.save().then(function(){
    gsStatus('Buscando dados atualizados da planilha (inclusive de outros dispositivos)...');
    return DB.load();
  }).then(function(ok){
    renderPage();
    gsStatus(ok ? '✅ Sincronizado às '+new Date().toLocaleTimeString('pt-BR')+'.' : '⚠️ Dados enviados, mas não foi possível reler a planilha agora.');
  });
}
function removerConfigSheets(){
  if(!confirm('Remover a conexão com o Google Sheets? Os dados cadastrados continuarão no navegador até uma nova conexão ser configurada, mas deixarão de ser salvos na nuvem.')) return;
  localStorage.removeItem(GS_URL_KEY);
  SCRIPT_URL = 'SUA_URL_DO_APPS_SCRIPT_AQUI';
  mostrarNotify('ok','Conexão removida.');
  renderSharePoint();
}
function salvarConfigSharePoint(){
  state.sharepoint = { siteUrl: document.getElementById('sp-site').value.trim(), listName: document.getElementById('sp-list').value.trim(), token: document.getElementById('sp-token').value.trim() };
  saveState();
  mostrarNotify('ok','Configuração do SharePoint salva.');
  renderSharePoint();
}
function spStatus(msg, isErr){
  var el = document.getElementById('sp-status');
  if(el) el.innerHTML = (isErr?'<span style="color:var(--err)">':'<span style="color:var(--ok)">')+msg+'</span>';
}
function resolveSiteId(siteUrl, token){
  var u = new URL(siteUrl);
  return fetch('https://graph.microsoft.com/v1.0/sites/'+u.hostname+':'+u.pathname, {
    headers: {Authorization:'Bearer '+token}
  }).then(function(r){ if(!r.ok) throw new Error('Falha ao resolver site (HTTP '+r.status+')'); return r.json(); }).then(function(j){ return j.id; });
}
function testarConexaoSharePoint(){
  salvarConfigSharePoint();
  var sp = state.sharepoint;
  if(!sp.siteUrl || !sp.token){ spStatus('Preencha a URL do site e o token de acesso.', true); return; }
  spStatus('Conectando...');
  resolveSiteId(sp.siteUrl, sp.token).then(function(siteId){
    spStatus('✅ Conexão bem-sucedida! Site ID: '+siteId);
  }).catch(function(err){
    spStatus('❌ '+esc(err.message)+'. Verifique a URL, o token e as permissões do app no Azure AD.', true);
  });
}
function enviarParaSharePoint(ev){
  salvarConfigSharePoint();
  var sp = state.sharepoint;
  if(!sp.siteUrl || !sp.listName || !sp.token){ spStatus('Preencha site, lista e token antes de enviar.', true); return; }
  var btnSync = ev.target; btnSync.disabled = true; btnSync.textContent = '⏳ Enviando...';
  spStatus('Enviando itens...');
  resolveSiteId(sp.siteUrl, sp.token).then(function(siteId){
    var itens = todosItensUnidade();
    var promessas = itens.map(function(i){
      return fetch('https://graph.microsoft.com/v1.0/sites/'+siteId+'/lists/'+encodeURIComponent(sp.listName)+'/items', {
        method:'POST',
        headers:{Authorization:'Bearer '+sp.token, 'Content-Type':'application/json'},
        body: JSON.stringify({fields:{Title:i.ativo, Tipo:i.tipo, Categoria:i.categoria, Local:i.local, Periodicidade:i.periodicidade, UltimaExecucao:i.ultimaExecucao, ProximaData:i.proximaData, Responsavel:i.responsavel, Custo:i.valor, Observacoes:i.obs, Unidade:state.unit}})
      });
    });
    return Promise.all(promessas);
  }).then(function(respostas){
    var falhas = respostas.filter(function(r){ return !r.ok; }).length;
    spStatus(falhas===0 ? '✅ '+respostas.length+' itens enviados com sucesso.' : '⚠️ Envio concluído com '+falhas+' falha(s) de '+respostas.length+'.', falhas>0);
  }).catch(function(err){ spStatus('❌ '+esc(err.message), true); }).finally(function(){ btnSync.disabled = false; btnSync.textContent = '⬆️ Enviar manutenções desta unidade'; });
}
function importarDoSharePoint(ev){
  salvarConfigSharePoint();
  var sp = state.sharepoint;
  if(!sp.siteUrl || !sp.listName || !sp.token){ spStatus('Preencha site, lista e token antes de importar.', true); return; }
  var btnSync = ev.target; btnSync.disabled = true; btnSync.textContent = '⏳ Importando...';
  spStatus('Importando itens...');
  resolveSiteId(sp.siteUrl, sp.token).then(function(siteId){
    return fetch('https://graph.microsoft.com/v1.0/sites/'+siteId+'/lists/'+encodeURIComponent(sp.listName)+'/items?expand=fields', {
      headers:{Authorization:'Bearer '+sp.token}
    });
  }).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(j){
    var novos = 0;
    (j.value||[]).forEach(function(li){
      var f = li.fields || {};
      if(!f.Title) return;
      state.itens[state.unit].push({
        id:uid(), tipo:f.Tipo||'predial', ativo:f.Title, categoria:f.Categoria||'Outros', local:f.Local||'',
        periodicidade:f.Periodicidade||'Trimestral', ultimaExecucao:f.UltimaExecucao||'', proximaData:f.ProximaData||new Date().toISOString().slice(0,10),
        responsavel:f.Responsavel||'', valor:parseFloat(f.Custo)||0, obs:f.Observacoes||''
      });
      novos++;
    });
    saveState();
    spStatus('✅ '+novos+' item(ns) importado(s) da lista do SharePoint.');
    if(state.menu==='predial'||state.menu==='frota'||state.menu==='dashboard') renderPage();
  }).catch(function(err){ spStatus('❌ '+esc(err.message), true); }).finally(function(){ btnSync.disabled = false; btnSync.textContent = '⬇️ Importar itens da lista'; });
}

function renderUsuarios(){
  if(!ehAdmin(state.currentUser)){ document.getElementById('content').innerHTML = '<div class="empty-state"><div class="es-ic">🔒</div><div class="es-txt">Apenas administradores podem gerenciar usuários.</div></div>'; return; }
  var html = '<div style="display:flex;justify-content:flex-end;margin-bottom:14px"><button class="btn-g" onclick="abrirModalUsuario()">+ Novo usuário</button></div>';
  if(!state.usuarios.length){
    html += '<div class="empty-state"><div class="es-ic">👤</div><div class="es-txt">Nenhum usuário cadastrado.</div></div>';
  } else {
    html += state.usuarios.map(function(u){
      var badges = ehAdmin(u) ? '<span class="usr-badge">⭐ Admin</span>' : (u.perfil||[]).map(function(p){ return '<span class="usr-badge">'+esc(MODULOS[p]||p)+'</span>'; }).join('');
      if(!u.ativo) badges += '<span class="usr-badge inativo">Inativo</span>';
      return '<div class="usr-row"><div><div class="usr-nome">'+esc(u.nome||u.usuario)+'</div><div class="usr-login">@'+esc(u.usuario)+'</div><div class="usr-badges">'+badges+'</div></div>'
        + '<div style="display:flex;gap:8px"><button class="btn-mini" onclick="abrirModalUsuario(\''+u.id+'\')">✏️ Editar</button><button class="btn-danger" onclick="excluirUsuario(\''+u.id+'\')">🗑️ Excluir</button></div></div>';
    }).join('');
  }
  html += '<div class="panel-hint" style="margin-top:14px">Perfil <b>Admin</b> tem acesso total (Predial, Frota, Doc. Legal, Integrações e Usuários). Os demais perfis liberam apenas os módulos marcados. As senhas são armazenadas apenas como hash (SHA-256), nunca em texto puro.</div>';
